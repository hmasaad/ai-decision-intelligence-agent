<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Decision Intelligence{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/board.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="wordmark" href="/">AI Decision Intelligence</a>
      <nav class="nav">
        <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Agent</a>
        <a href="/recall" {% if request.url.path == '/recall' %}aria-current="page"{% endif %}>Memory</a>
      </nav>
    </div>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
